name: Site CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-site:
    name: Verify site contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install pinned hosting manifest verifier
        run: npm install --global firebase-tools@15.29.0
      - name: Verify site contracts and exact public manifest
        run: FIREBASE_TOOLS_ROOT="$(npm root --global)/firebase-tools" node verify-site.mjs
